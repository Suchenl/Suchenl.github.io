name: Lighthouse baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse.yml'
      - 'web/scripts/performance-baseline.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1 lighthouse@12.8.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Measure performance and accessibility baseline
        run: node scripts/performance-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-baseline
          path: web/lighthouse-results/
          retention-days: 7
