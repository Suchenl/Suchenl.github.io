# Builds the Astro site in web/ and deploys it to GitHub Pages.
# NOTE: This only takes effect once repo Settings > Pages > Source is set to
# "GitHub Actions". Until then, the existing Jekyll deploy stays live.
name: Deploy Astro site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-astro.yml'
  # Refresh Cloudflare stats JSON even without content pushes.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the blog can derive published/updated dates from git.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Pull CF Web Analytics into public/analytics/cloudflare.json (no-op stub if secrets missing).
      - name: Fetch Cloudflare Web Analytics
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
          CF_LOOKBACK_DAYS: '7'
        run: node scripts/fetch-cloudflare-analytics.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
