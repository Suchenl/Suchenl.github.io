# Builds the Astro site in web/ and deploys it to GitHub Pages.
name: Deploy Astro site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-astro.yml'
  # Sunday 23:59 Asia/Shanghai = Sunday 15:59 UTC — pull Mon→Sun week into history.
  schedule:
    - cron: '59 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      # Content push: only rebuild display JSON from committed history (no CF API).
      - name: Refresh analytics display from history
        if: github.event_name == 'push'
        run: node scripts/fetch-cloudflare-analytics.mjs

      # Sunday night cron / manual: fetch the Beijing Mon–Sun week and upsert history.
      - name: Weekly Cloudflare analytics update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
          CF_WEEKLY_UPDATE: '1'
          CF_BOOTSTRAP: '1'
        run: node scripts/fetch-cloudflare-analytics.mjs

      - name: Commit analytics history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/analytics/cloudflare-history.json web/public/analytics/cloudflare.json
          if git diff --staged --quiet; then
            echo "No analytics changes to commit"
          else
            git commit -m "chore: weekly Cloudflare analytics snapshot [skip ci]"
            git push
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
