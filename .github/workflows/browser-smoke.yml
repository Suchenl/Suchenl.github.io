name: Browser UI smoke
on:
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'knowledge/**'
      - 'web/scripts/check-knowledge-taxonomy.mjs'
      - 'web/scripts/check-research-render.mjs'
      - 'web/scripts/check-site.mjs'
      - 'web/scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-smoke-main
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Prepare Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/browser-smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-compare-visual-qa
          path: web/visual-qa/*.png
          retention-days: 3
          if-no-files-found: ignore
