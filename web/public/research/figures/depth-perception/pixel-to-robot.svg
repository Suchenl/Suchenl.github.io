<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="510" viewBox="0 0 1220 510" role="img" aria-label="RGB 像素深度反投影至机器人基座"><title>RGB 像素深度反投影至机器人基座</title><style>
text{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft Yahei",sans-serif;fill:#263c52}
.t{font-size:27px;font-weight:720}.sub{font-size:16px;fill:#687e90}.mid{font-size:19px;font-weight:640}.small{font-size:16px;fill:#4b6178}.tiny{font-size:14px;fill:#6c8095}
.box{fill:#fff;stroke:#d3dfeb;stroke-width:1.5}.blue{fill:#ecf4ff;stroke:#9cc3ec;stroke-width:1.5}
.green{fill:#e9f7f1;stroke:#99d3b9;stroke-width:1.5}.orange{fill:#fff5e6;stroke:#eed09e;stroke-width:1.5}
.red{fill:#fdf0ef;stroke:#e6b1aa;stroke-width:1.5}.purple{fill:#f1efff;stroke:#bcb4ea;stroke-width:1.5}
.line{stroke:#7b98af;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#7b98af"/></marker></defs><rect width="1220" height="510" fill="#f8fbfe"/>
<text x="42" y="52" class="t" >像素 + 深度 → 三维点：坐标与时间同样重要</text>
<text x="42" y="80" class="sub" >RGB 与 Depth 不同成像器时，先对齐；图像 resize / crop 后，必须同步更新内参。</text>
<rect x="41" y="122" width="264" height="133" rx="14" class="blue"/><text x="173" y="158" class="mid" text-anchor="middle">RGB 像素 (u,v)</text><text x="173" y="189" class="small" text-anchor="middle">Depth Map 的对应坐标</text><text x="173" y="220" class="tiny" text-anchor="middle">Color ↔ Depth Alignment</text>
<path d="M305 187H356" class="line" marker-end="url(#arr)" />
<rect x="358" y="122" width="277" height="133" rx="14" class="green"/><text x="496" y="158" class="mid" text-anchor="middle">内参 K + 深度 Z</text><text x="496" y="187" class="small" text-anchor="middle">Pc = Z · K⁻¹ [u,v,1]ᵀ</text><text x="496" y="220" class="tiny" text-anchor="middle">Z-depth ≠ Ray Range</text>
<path d="M635 187H685" class="line" marker-end="url(#arr)" />
<rect x="687" y="122" width="253" height="133" rx="14" class="orange"/><text x="813" y="158" class="mid" text-anchor="middle">外参 Tbase←cam</text><text x="813" y="187" class="small" text-anchor="middle">坐标系 / 手眼标定</text><text x="813" y="219" class="tiny" text-anchor="middle">与机器人姿态同步</text>
<path d="M940 187H984" class="line" marker-end="url(#arr)" />
<rect x="985" y="122" width="197" height="133" rx="14" class="purple"/><text x="1083" y="161" class="mid" text-anchor="middle">Pbase</text><text x="1083" y="192" class="small" text-anchor="middle">机器人基座系</text><text x="1083" y="217" class="small" text-anchor="middle">的 3D 点</text>
<rect x="85" y="302" width="1050" height="132" rx="14" class="box"/>
<text x="610" y="335" class="mid" text-anchor="middle">最常见四类错误</text>
<text x="610" y="371" class="small" text-anchor="middle">① 原图 K 用于裁剪图　② 把 Ray Range 当成 Z　③ 忘记 RGB/Depth 相机外参</text>
<text x="610" y="405" class="small" text-anchor="middle">④ 机器人运动时把旧时间戳 Depth 投到新姿态</text>
<text x="42" y="485" class="tiny" >正确三维坐标 ≠ 可抓取接触点；抓取还需要目标表面、法线、碰撞和夹爪几何约束。</text>
</svg>