<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="626" viewBox="0 0 1220 626" role="img" aria-label="RGB 与深度的保真融合流程"><title>RGB 与深度的保真融合流程</title><style>
text{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft Yahei",sans-serif;fill:#263c52}
.t{font-size:27px;font-weight:720}.sub{font-size:16px;fill:#687e90}.mid{font-size:19px;font-weight:640}.small{font-size:16px;fill:#4b6178}.tiny{font-size:14px;fill:#6c8095}
.box{fill:#fff;stroke:#d3dfeb;stroke-width:1.5}.blue{fill:#ecf4ff;stroke:#9cc3ec;stroke-width:1.5}
.green{fill:#e9f7f1;stroke:#99d3b9;stroke-width:1.5}.orange{fill:#fff5e6;stroke:#eed09e;stroke-width:1.5}
.red{fill:#fdf0ef;stroke:#e6b1aa;stroke-width:1.5}.purple{fill:#f1efff;stroke:#bcb4ea;stroke-width:1.5}
.line{stroke:#7b98af;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#7b98af"/></marker></defs><rect width="1220" height="626" fill="#f8fbfe"/>
<text x="42" y="50" class="t" >RGB-D 融合：别把推断补全覆盖成“真实测量”</text>
<text x="42" y="79" class="sub" >先保存原始证据，再把相机几何、视觉先验和可靠性判断组合成可追溯的输出。</text>
<rect x="42" y="121" width="342" height="102" rx="14" class="blue"/><text x="213" y="156" class="mid" text-anchor="middle">原始 RGB</text><text x="213" y="184" class="small" text-anchor="middle">纹理、语义、边界、相机 K</text>
<rect x="836" y="121" width="342" height="102" rx="14" class="blue"/><text x="1007" y="156" class="mid" text-anchor="middle">原始传感器 Depth</text><text x="1007" y="184" class="small" text-anchor="middle">米制数值、设备标志、Mask</text>
<path d="M213 224V254H387V287" class="line" marker-end="url(#arr)" /><path d="M1007 224V254H832V287" class="line" marker-end="url(#arr)" />
<rect x="389" y="287" width="440" height="103" rx="14" class="orange"/><text x="609" y="319" class="mid" text-anchor="middle">几何校验与可靠性门控</text><text x="609" y="347" class="small" text-anchor="middle">量程 · 同步 · 对齐 · 跨视角 · 残差</text><text x="609" y="372" class="tiny" text-anchor="middle">不是仅判断 depth &gt; 0</text>
<path d="M215 224V425H390" class="line" marker-end="url(#arr)" /><path d="M1005 224V425H829" class="line" marker-end="url(#arr)" />
<rect x="40" y="440" width="366" height="89" rx="14" class="purple"/><text x="223" y="471" class="mid" text-anchor="middle">视觉先验 / Depth Predictor</text><text x="223" y="498" class="small" text-anchor="middle">候选补全，可能存在域偏差</text>
<rect x="814" y="440" width="366" height="89" rx="14" class="green"/><text x="997" y="471" class="mid" text-anchor="middle">通过校验的测量证据</text><text x="997" y="498" class="small" text-anchor="middle">不能视为绝对 Ground Truth</text>
<path d="M610 391V446" class="line" marker-end="url(#arr)" /><path d="M406 486H453" class="line" marker-end="url(#arr)" /><path d="M814 486H765" class="line" marker-end="url(#arr)" />
<rect x="454" y="447" width="310" height="78" rx="14" class="blue"/><text x="609" y="480" class="mid" text-anchor="middle">条件融合 + 可拒绝决策</text><text x="609" y="504" class="small" text-anchor="middle">不确定时保留 Unknown</text>
<path d="M610 526V545" class="line" marker-end="url(#arr)" />
<rect x="246" y="548" width="729" height="55" rx="14" class="box"/><text x="610" y="580" class="mid" text-anchor="middle">Depth Fused + Source Map + Confidence + Calibration + Timestamp</text>
</svg>