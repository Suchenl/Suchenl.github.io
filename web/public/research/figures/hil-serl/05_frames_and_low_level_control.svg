<svg baseProfile="full" height="910" version="1.1" viewBox="0 0 1440 910" width="1440" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FC" height="910" width="1440" x="0" y="0" /><rect fill="#3568D4" height="9" width="1440" x="0" y="0" /><text fill="#3568D4" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" opacity="1" text-anchor="start" x="54" y="51">05  /  COORDINATES &amp; CONTROL</text><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="39" font-weight="700" opacity="1" text-anchor="start" x="54" y="103">坐标归一化与 10Hz / 1kHz 双层控制</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="55" y="141">相对初始末端位姿构造本体输入；动作相对当前末端坐标系；底层阻抗控制器承担稳定执行。</text><line stroke="#CBD5E1" stroke-width="1.2" x1="53" x2="1387" y1="867" y2="867" /><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" opacity="1" text-anchor="start" x="55" y="892">HIL-SERL 深度解读   ·   原创结构化示意图 / 依据论文绘制</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="400" opacity="1" text-anchor="end" x="1385" y="892">05_frames_and_low_level_control</text><rect fill="#FFFFFF" height="548" rx="18" ry="18" stroke="#CBD5E1" stroke-width="1.35" width="675" x="48" y="199" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="start" x="84" y="242">A  /  三个坐标系（示意）</text><rect fill="#F4F7FC" height="270" rx="18" stroke="#CBD5E1" width="600" x="80" y="280" /><circle cx="180" cy="478" fill="#3568D4" r="7" stroke="none" /><line fill="none" stroke="#3568D4" stroke-linecap="round" stroke-width="2.5" x1="180" x2="250" y1="478" y2="478" /><polygon fill="#3568D4" points="250,478 239.24737002969368,483.32737728358626 239.24737002969368,472.67262271641374" /><line fill="none" stroke="#3568D4" stroke-linecap="round" stroke-width="2.5" x1="180" x2="180" y1="478" y2="415" /><polygon fill="#3568D4" points="180,415 185.32737728358623,425.7526299703063 174.67262271641377,425.7526299703063" /><text fill="#3568D4" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" opacity="1" text-anchor="start" x="160" y="522">S  机器人基座</text><circle cx="350" cy="402" fill="#E38A37" r="7" stroke="none" /><line fill="none" stroke="#E38A37" stroke-linecap="round" stroke-width="2.5" x1="350" x2="420" y1="402" y2="402" /><polygon fill="#E38A37" points="420,402 409.2473700296937,407.32737728358626 409.2473700296937,396.67262271641374" /><line fill="none" stroke="#E38A37" stroke-linecap="round" stroke-width="2.5" x1="350" x2="350" y1="402" y2="339" /><polygon fill="#E38A37" points="350,339 355.32737728358626,349.7526299703063 344.67262271641374,349.7526299703063" /><text fill="#E38A37" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" opacity="1" text-anchor="start" x="330" y="446">b0  Episode 初始 EEF</text><circle cx="522" cy="336" fill="#008A8A" r="7" stroke="none" /><line fill="none" stroke="#008A8A" stroke-linecap="round" stroke-width="2.5" x1="522" x2="592" y1="336" y2="336" /><polygon fill="#008A8A" points="592,336 581.2473700296937,341.32737728358626 581.2473700296937,330.67262271641374" /><line fill="none" stroke="#008A8A" stroke-linecap="round" stroke-width="2.5" x1="522" x2="522" y1="336" y2="273" /><polygon fill="#008A8A" points="522,273 527.3273772835862,283.7526299703063 516.6726227164138,283.7526299703063" /><text fill="#008A8A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" opacity="1" text-anchor="start" x="502" y="380">bt  当前 EEF</text><line fill="none" stroke="#7A60B6" stroke-dasharray="6,5" stroke-linecap="round" stroke-width="3" x1="350" x2="522" y1="402" y2="336" /><polygon fill="#7A60B6" points="522,336 513.7461069938178,344.7105252564065 510.06951724071155,334.71020112795765" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" opacity="1" text-anchor="start" x="103" y="598">本体输入：T(b0 → bt) = inverse[T(S → b0)] · T(S → bt)</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="103" y="636">策略动作：在当前 bt 系下产生末端 twist</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="103" y="672">送入基座系控制前，需要相应坐标变换。</text><rect fill="#FFFFFF" height="548" rx="18" ry="18" stroke="#CBD5E1" stroke-width="1.35" width="630" x="759" y="199" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="start" x="792" y="241">B  /  双速率控制栈</text><rect fill="#EAF1FF" height="108" rx="18" ry="18" stroke="#EAF1FF" stroke-width="1.35" width="546" x="797" y="278" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="818" y="317">策略网络  10 Hz</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="818" y="353">输出末端 twist setpoint 或动态 wrench</text><line fill="none" stroke="#3568D4" stroke-linecap="round" stroke-width="3" x1="1074" x2="1074" y1="388" y2="429" /><polygon fill="#3568D4" points="1074,429 1068.6726227164138,418.2473700296937 1079.3273772835862,418.2473700296937" /><rect fill="#E1F7F5" height="111" rx="18" ry="18" stroke="#E1F7F5" stroke-width="1.35" width="546" x="797" y="433" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="818" y="472">底层控制器  1000 Hz</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="818" y="508">阻抗控制 + reference limiting</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="818" y="536">接触任务需防止目标位姿过远引发过大力</text><line fill="none" stroke="#008A8A" stroke-linecap="round" stroke-width="3" x1="1074" x2="1074" y1="545" y2="592" /><polygon fill="#008A8A" points="1074,592 1068.6726227164138,581.2473700296937 1079.3273772835862,581.2473700296937" /><rect fill="#F0F3F8" height="99" rx="18" ry="18" stroke="#F0F3F8" stroke-width="1.35" width="546" x="797" y="599" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="818" y="638">执行器 / 真实物理接触</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="818" y="674">力 / 关节力矩控制；动作后回传观测</text><rect fill="#FFECEF" height="36" rx="18" width="565" x="91" y="775" /><text fill="#D95E68" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="600" opacity="1" text-anchor="middle" x="373.5" y="799">安全性不是由 RL 自己“学会保证”的</text><rect fill="#E1F7F5" height="36" rx="18" width="652" x="679" y="775" /><text fill="#008A8A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" opacity="1" text-anchor="middle" x="1005.0" y="799">机器人底层反馈与限幅是实验能落地的重要前提</text></svg>