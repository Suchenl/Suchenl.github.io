<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="840" version="1.1" viewBox="0 0 1440 840" width="1440" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FC" height="840" width="1440" x="0" y="0" /><rect fill="#3568D4" height="9" width="1440" x="0" y="0" /><text fill="#3568D4" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" opacity="1" text-anchor="start" x="54" y="51">03  /  TRAINING RECIPE</text><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="39" font-weight="700" opacity="1" text-anchor="start" x="54" y="103">从零训练一项精密技能，实际需要准备什么？</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="55" y="141">论文 §3.5 + 附录 B：先定义奖励，再收集少量示范，最后以人工纠正辅助真实世界 RL。</text><line stroke="#CBD5E1" stroke-width="1.2" x1="53" x2="1387" y1="797" y2="797" /><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" opacity="1" text-anchor="start" x="55" y="822">HIL-SERL 深度解读   ·   原创结构化示意图 / 依据论文绘制</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="400" opacity="1" text-anchor="end" x="1385" y="822">03_training_recipe</text><rect fill="#EAF1FF" height="160" rx="18" ry="18" stroke="#EAF1FF" stroke-width="1.35" width="322" x="56" y="217" /><rect fill="#3568D4" height="130" rx="2.5" width="5" x="56" y="232" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="77" y="256">① 摄像头与裁剪</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="77" y="292">腕部 / 侧面摄像头</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="77" y="320">裁剪到 128 × 128</text><line fill="none" stroke="#3568D4" stroke-linecap="round" stroke-width="2" x1="378" x2="402" y1="295" y2="295" /><polygon fill="#3568D4" points="402,295 391.2473700296937,300.32737728358626 391.2473700296937,289.67262271641374" /><rect fill="#F0EBFB" height="160" rx="18" ry="18" stroke="#F0EBFB" stroke-width="1.35" width="322" x="406" y="217" /><rect fill="#7A60B6" height="130" rx="2.5" width="5" x="406" y="232" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="427" y="256">② 奖励分类器</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="427" y="292">约 200 正例 + 1000 负例</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="427" y="320">ResNet-10 + 两层 MLP</text><line fill="none" stroke="#7A60B6" stroke-linecap="round" stroke-width="2" x1="728" x2="752" y1="295" y2="295" /><polygon fill="#7A60B6" points="752,295 741.2473700296937,300.32737728358626 741.2473700296937,289.67262271641374" /><rect fill="#FFF2E5" height="160" rx="18" ry="18" stroke="#FFF2E5" stroke-width="1.35" width="322" x="756" y="217" /><rect fill="#E38A37" height="130" rx="2.5" width="5" x="756" y="232" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="777" y="256">③ 示范数据</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="777" y="292">约 20–30 条成功示范</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="777" y="320">初始化 Demo Buffer</text><line fill="none" stroke="#E38A37" stroke-linecap="round" stroke-width="2" x1="1078" x2="1102" y1="295" y2="295" /><polygon fill="#E38A37" points="1102,295 1091.2473700296937,300.32737728358626 1091.2473700296937,289.67262271641374" /><rect fill="#E1F7F5" height="160" rx="18" ry="18" stroke="#E1F7F5" stroke-width="1.35" width="322" x="1106" y="217" /><rect fill="#008A8A" height="130" rx="2.5" width="5" x="1106" y="232" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="1127" y="256">④ 在线学习</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="1127" y="292">机器人探索 + 人工接管</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="1127" y="320">Learner 使用 RLPD</text><rect fill="#FFFFFF" height="260" rx="18" ry="18" stroke="#CBD5E1" stroke-width="1.35" width="615" x="65" y="455" /><rect fill="#7A60B6" height="230" rx="2.5" width="5" x="65" y="470" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="start" x="86" y="494">奖励不是 dense shaping，而是成功 / 失败</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="86" y="530">分类器判定是否完成任务，通常成功才给正奖励。</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="86" y="558">标注“插错槽、只插入一侧、未完全插入”等硬负例</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="86" y="586">分类器准确率通常 &gt; 95%，不等于零误判。</text><rect fill="#FFFFFF" height="260" rx="18" ry="18" stroke="#CBD5E1" stroke-width="1.35" width="610" x="758" y="455" /><rect fill="#E38A37" height="230" rx="2.5" width="5" x="758" y="470" /><text fill="#15243D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="start" x="779" y="494">重复尝试与人工反馈</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="779" y="530">早期遇到卡死、错误抓握时，人类可短时接管。</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="779" y="558">策略改善后减少接管，让机器人自己继续探索。</text><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="779" y="586">作者特别提醒：避免长而稀疏的接管造成 Q 高估。</text><rect fill="#EAF1FF" height="36" rx="18" width="290" x="89" y="748" /><text fill="#3568D4" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="600" opacity="1" text-anchor="middle" x="234.0" y="772">实际训练时间：多数 1–2.5 小时</text><rect fill="#FFECEF" height="36" rx="18" width="290" x="402" y="748" /><text fill="#D95E68" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="600" opacity="1" text-anchor="middle" x="547.0" y="772">同步带任务：6 小时</text><rect fill="#F0F3F8" height="36" rx="18" width="578" x="722" y="748" /><text fill="#61718A" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="600" opacity="1" text-anchor="middle" x="1011.0" y="772">训练时间含动作执行 / 停机 / 在线计算；不等于总人力成本</text></svg>