<rect x="165" y="130" width="570" height="325" rx="16" fill="#F3F0E8" stroke="#C1A479" stroke-width="1.3"/><text x="450" y="166" font-size="19" font-weight="700" fill="#253548" text-anchor="middle">Sequence：一次完整的 Agent Loop</text>
<rect x="205" y="187" width="490" height="220" rx="15" fill="#E7F3EF" stroke="#80AD9B" stroke-width="1.3"/><text x="450" y="225" font-size="18" font-weight="700" fill="#253548" text-anchor="middle">Context：对话分支与模型上下文</text>
