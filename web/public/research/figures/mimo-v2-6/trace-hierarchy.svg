<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="MiMo-V2.6 Sample / Sequence / Context / Segment 四层数据结构"><title>MiMo-V2.6 Sample / Sequence / Context / Segment 四层数据结构</title><rect width="900" height="560" rx="18" fill="#F8FAFC"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
<text x="450" y="45" font-size="25" font-weight="700" fill="#253548" text-anchor="middle">长时 Agent RL 轨迹的四层组织</text>
