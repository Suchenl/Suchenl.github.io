<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-label="MiMo-V2.6 预训练、中期训练、SFT、Mixed RL、MOPD2 五阶段"><title>MiMo-V2.6 预训练、中期训练、SFT、Mixed RL、MOPD2 五阶段</title><rect width="900" height="610" rx="18" fill="#F8FAFC"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
<text x="450" y="46" font-size="25" font-weight="700" fill="#253548" text-anchor="middle">MiMo-V2.6 完整训练链路</text>
<rect x="115" y="75" width="670" height="74" rx="12" fill="#EAF0F7" stroke="#86A4C0" stroke-width="1.3"/><text x="450" y="104" font-size="21" font-weight="700" fill="#253548" text-anchor="middle">1 · Pre-training</text><text x="450" y="129" font-size="15" font-weight="400" fill="#253548" text-anchor="middle">文本、多模态数据；构建知识、视觉与语言能力</text><path d="M450 149L450 165" fill="none" stroke="#8BA0B2" stroke-width="2.2" /><path d="M445 161l5 6 5-6" fill="none" stroke="#8BA0B2" stroke-width="2"/><rect x="115" y="175" width="670" height="74" rx="12" fill="#EFF3F8" stroke="#86A4C0" stroke-width="1.3"/><text x="450" y="204" font-size="21" font-weight="700" fill="#253548" text-anchor="middle">2 · Mid-training</text><text x="450" y="229" font-size="15" font-weight="400" fill="#253548" text-anchor="middle">长上下文、Agent 轨迹、工具交互；拓展探索空间</text><path d="M450 249L450 265" fill="none" stroke="#8BA0B2" stroke-width="2.2" /><path d="M445 261l5 6 5-6" fill="none" stroke="#8BA0B2" stroke-width="2"/><rect x="115" y="275" width="670" height="74" rx="12" fill="#F7F0E7" stroke="#C2A17D" stroke-width="1.3"/><text x="450" y="304" font-size="21" font-weight="700" fill="#253548" text-anchor="middle">3 · Short SFT</text><text x="450" y="329" font-size="15" font-weight="400" fill="#253548" text-anchor="middle">初始化可靠的工具调用与 Agent 行为</text><path d="M450 349L450 365" fill="none" stroke="#8BA0B2" stroke-width="2.2" /><path d="M445 361l5 6 5-6" fill="none" stroke="#8BA0B2" stroke-width="2"/><rect x="115" y="375" width="670" height="74" rx="12" fill="#EAF3F0" stroke="#78A68D" stroke-width="1.3"/><text x="450" y="404" font-size="21" font-weight="700" fill="#253548" text-anchor="middle">4 · Mixed Agentic RL</text><text x="450" y="429" font-size="15" font-weight="400" fill="#253548" text-anchor="middle">GRPO + 多环境 + Mini-Harness + Groupwise Grading</text><path d="M450 449L450 465" fill="none" stroke="#8BA0B2" stroke-width="2.2" /><path d="M445 461l5 6 5-6" fill="none" stroke="#8BA0B2" stroke-width="2"/><rect x="115" y="475" width="670" height="74" rx="12" fill="#F4EFF7" stroke="#AE96BB" stroke-width="1.3"/><text x="450" y="504" font-size="21" font-weight="700" fill="#253548" text-anchor="middle">5 · MOPD2</text><text x="450" y="529" font-size="15" font-weight="400" fill="#253548" text-anchor="middle">多教师在线策略蒸馏；整合特殊能力</text>
<text x="450" y="584" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">注意：Agentic RL 不是跳过预训练、SFT 的单阶段配方</text>
</g></svg>