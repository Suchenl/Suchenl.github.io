<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-label="RLPD 对称采样与Actor-Critic更新流程"><rect width="1100" height="590" rx="24" fill="#f7f9fc"/>
<defs><marker id="batch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60758d"/></marker></defs>
<text x="45" y="55" font-size="31" font-weight="700" fill="#14253f">RLPD：相同格式的 Transition，同一个 RL 更新目标</text><text x="45" y="85" font-size="17" fill="#60738c">两类数据来自不同策略，但都含有实际执行的 (s, a, r, s', done)</text>
<rect x="65" y="135" width="420" height="133" rx="20" fill="#fff0e1" stroke="#eac69f"/><text x="93" y="178" font-size="24" font-weight="700" fill="#9d621d">Prior / Demo Buffer</text><text x="93" y="213" font-size="18" fill="#805c3a">历史示范、旧策略或次优数据</text><text x="93" y="242" font-size="18" fill="#805c3a">采样 50%</text>
<rect x="614" y="135" width="420" height="133" rx="20" fill="#e9f0ff" stroke="#adc5ed"/><text x="641" y="178" font-size="24" font-weight="700" fill="#2358a5">Online RL Buffer</text><text x="641" y="213" font-size="18" fill="#526b96">真实执行产生的新 Transition</text><text x="641" y="242" font-size="18" fill="#526b96">采样 50%</text>
<path d="M275 268 V305 H550 V340" stroke="#60758d" stroke-width="3" fill="none" marker-end="url(#batch-arrow)"/><path d="M824 268 V305 H550 V340" stroke="#60758d" stroke-width="3" fill="none" marker-end="url(#batch-arrow)"/>
<rect x="369" y="340" width="362" height="70" rx="16" fill="#e2f5f1" stroke="#96cdbf"/><text x="550" y="371" text-anchor="middle" font-size="22" font-weight="700" fill="#096f66">混合 Batch</text><text x="550" y="394" text-anchor="middle" font-size="16" fill="#3f7b74">不是两套不同训练 Loss</text>
<path d="M488 410 V450 H282 V468" stroke="#60758d" stroke-width="3" fill="none" marker-end="url(#batch-arrow)"/><path d="M611 410 V450 H831 V468" stroke="#60758d" stroke-width="3" fill="none" marker-end="url(#batch-arrow)"/>
