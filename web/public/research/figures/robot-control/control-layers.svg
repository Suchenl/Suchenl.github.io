<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570" role="img" aria-label="机器人从Agent任务到运动规划和低层控制的分层执行流程"><rect width="1160" height="570" rx="24" fill="#f7f9fc"/><text x="45" y="60" font-size="29" font-weight="700" fill="#14253f">同一个机器人任务，不是“模型输出位置”就结束</text><text x="45" y="90" font-size="17" fill="#62738a">任务 / 路径 / 控制 / 物理反馈属于不同时间尺度和责任边界</text>
<defs><marker id="ctl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64758e"/></marker></defs>
<rect x="56" y="145" width="260" height="106" rx="17" fill="#e8efff"/><text x="186" y="182" text-anchor="middle" font-size="24" font-weight="700" fill="#285ca8">任务 / Agent</text><text x="186" y="216" text-anchor="middle" font-size="17" fill="#536c95">选目标、技能、何时重试</text>
<rect x="450" y="145" width="260" height="106" rx="17" fill="#e8efff"/><text x="580" y="182" text-anchor="middle" font-size="24" font-weight="700" fill="#285ca8">规划 / IK</text><text x="580" y="216" text-anchor="middle" font-size="17" fill="#536c95">路径、约束、可达性</text>
<rect x="844" y="145" width="260" height="106" rx="17" fill="#def5ed"/><text x="974" y="182" text-anchor="middle" font-size="24" font-weight="700" fill="#0b806c">底层控制器</text><text x="974" y="216" text-anchor="middle" font-size="17" fill="#4c8074">PD / OSC / 阻抗 / 力矩</text>
<path d="M316 198 H450" stroke="#64758e" stroke-width="3" marker-end="url(#ctl-arr)"/><text x="358" y="183" font-size="15" fill="#64758e">目标</text><path d="M710 198 H844" stroke="#64758e" stroke-width="3" marker-end="url(#ctl-arr)"/><text x="755" y="183" font-size="15" fill="#64758e">轨迹</text>
<rect x="844" y="348" width="260" height="116" rx="17" fill="#fff0e2"/><text x="974" y="392" text-anchor="middle" font-size="24" font-weight="700" fill="#905b24">机械臂 / 场景</text><text x="974" y="422" text-anchor="middle" font-size="17" fill="#916e4d">真实接触与执行结果</text>
<path d="M974 251 V348" stroke="#64758e" stroke-width="3" marker-end="url(#ctl-arr)"/>
<path d="M844 404 H580 V251" fill="none" stroke="#079584" stroke-width="2.8" stroke-dasharray="8 6" marker-end="url(#ctl-arr)"/><text x="596" y="388" font-size="17" fill="#078b7d">观测、关节测量</text>
<path d="M844 436 H186 V251" fill="none" stroke="#079584" stroke-width="2.8" stroke-dasharray="8 6" marker-end="url(#ctl-arr)"/><text x="265" y="423" font-size="17" fill="#078b7d">任务反馈与下一轮决策</text>
<text x="48" y="526" font-size="17" fill="#4e627f">说明：不同机器人可能略过 IK 或直接输出力矩；此图仅用一条常见路径解释接口。</text></svg>