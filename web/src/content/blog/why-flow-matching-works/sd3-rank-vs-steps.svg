<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<rect x="8" y="8" width="704" height="544" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<text x="36" y="40" font-size="19" font-weight="700" fill="#1c1c1e">SD3: how sampling steps reshuffle the ranking</text>
<text x="36" y="64" font-size="12.5" fill="#6b7280">Higher = better (rank 1 = best). RF leads at few steps; eps/linear and EDM catch up at many steps.</text>
<text x="210" y="90" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">5 steps</text>
<text x="520" y="90" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">50 steps</text>
<line x1="210" y1="100" x2="210" y2="455" stroke="#eceded" stroke-width="1"/>
<line x1="520" y1="100" x2="520" y2="455" stroke="#eceded" stroke-width="1"/>
<text x="150" y="106" font-size="11" fill="#9aa0a6">better</text>
<line x1="210" y1="160.7" x2="520" y2="132.7" stroke="#e5484d" stroke-width="2.4"/>
<circle cx="210" cy="160.7" r="4" fill="#e5484d"/>
<circle cx="520" cy="132.7" r="4" fill="#e5484d"/>
<text x="204" y="164.7" font-size="11" fill="#e5484d" text-anchor="end">4.25</text>
<text x="527" y="136.7" font-size="11" fill="#e5484d" text-anchor="start">2.75</text>
<line x1="210" y1="240.1" x2="520" y2="100.0" stroke="#d9730d" stroke-width="2.0"/>
<circle cx="210" cy="240.1" r="3.5" fill="#d9730d"/>
<circle cx="520" cy="100.0" r="3.5" fill="#d9730d"/>
<text x="204" y="244.1" font-size="11" fill="#d9730d" text-anchor="end">8.5</text>
<text x="527" y="104.0" font-size="11" fill="#d9730d" text-anchor="start">1.0</text>
<line x1="210" y1="328.9" x2="520" y2="142.0" stroke="#12a794" stroke-width="2.0"/>
<circle cx="210" cy="328.9" r="3.5" fill="#12a794"/>
<circle cx="520" cy="142.0" r="3.5" fill="#12a794"/>
<text x="204" y="332.9" font-size="11" fill="#12a794" text-anchor="end">13.25</text>
<text x="527" y="146.0" font-size="11" fill="#12a794" text-anchor="start">3.25</text>
<line x1="210" y1="202.8" x2="520" y2="188.8" stroke="#9aa0a6" stroke-width="1.8"/>
<circle cx="210" cy="202.8" r="3.5" fill="#9aa0a6"/>
<circle cx="520" cy="188.8" r="3.5" fill="#9aa0a6"/>
<text x="204" y="206.8" font-size="11" fill="#9aa0a6" text-anchor="end">6.5</text>
<text x="527" y="192.8" font-size="11" fill="#9aa0a6" text-anchor="start">5.75</text>
<line x1="210" y1="188.8" x2="520" y2="226.1" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="210" cy="188.8" r="3.5" fill="#9aa0a6"/>
<circle cx="520" cy="226.1" r="3.5" fill="#9aa0a6"/>
<text x="204" y="192.8" font-size="11" fill="#9aa0a6" text-anchor="end">5.75</text>
<text x="527" y="230.1" font-size="11" fill="#9aa0a6" text-anchor="start">7.75</text>
<line x1="210" y1="104.7" x2="520" y2="109.3" stroke="#5b5bd6" stroke-width="3.0"/>
<circle cx="210" cy="104.7" r="4.5" fill="#5b5bd6"/>
<circle cx="520" cy="109.3" r="4.5" fill="#5b5bd6"/>
<text x="204" y="108.7" font-size="11" fill="#5b5bd6" text-anchor="end" font-weight="700">1.25</text>
<text x="527" y="113.3" font-size="11" fill="#5b5bd6" text-anchor="start" font-weight="700">1.5</text>
<g font-size="12" fill="#374151">
<line x1="40" y1="490" x2="66" y2="490" stroke="#5b5bd6" stroke-width="3.0"/>
<text x="74" y="494">rf/lognorm(0.00, 1.00)</text>
<line x1="390" y1="490" x2="416" y2="490" stroke="#e5484d" stroke-width="2.4"/>
<text x="424" y="494">eps/linear (old baseline)</text>
<line x1="40" y1="513" x2="66" y2="513" stroke="#d9730d" stroke-width="2.0"/>
<text x="74" y="517">rf/lognorm(0.50, 0.60)</text>
<line x1="390" y1="513" x2="416" y2="513" stroke="#12a794" stroke-width="2.0"/>
<text x="424" y="517">edm(0.00, 0.60)</text>
<line x1="40" y1="536" x2="66" y2="536" stroke="#9aa0a6" stroke-width="1.8"/>
<text x="74" y="540">rf (uniform)</text>
<line x1="390" y1="536" x2="416" y2="536" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="424" y="540">v/linear</text>
</g>
</svg>
